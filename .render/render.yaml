services:
  - type: web
    name: secureexplain-ai-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.8"
      - key: ENVIRONMENT
        value: "production"
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        value: "sqlite:///./secureexplain.db"
      - key: SCAN_TIMEOUT_SECONDS
        value: "15"
      - key: RATE_LIMIT_PER_MINUTE
        value: "20"
